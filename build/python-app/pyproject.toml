
[project]
name = "pastelaria"
version = "1.0.0"
description = "Aplicativo de gerenciamento de comandas e vendas de uma pastelaria"
requires-python = ">=3.12"
dependencies = [
    "flet==1.0.5",
    "supabase==2.34.0",
    "python-dotenv==1.2.4",
    "tzdata==2026.6",
]

[tool.flet]
product = "Pastelaria"
org = "br.com.pastelaria"


[tool.flet.android.gradle_properties]
"org.gradle.jvmargs" = "-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError"
"org.gradle.workers.max" = "2"
"org.gradle.parallel" = "false"